services:
  # Backend API Service
  - type: web
    name: civicfix-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn civicfix_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    
  # Frontend Service
  - type: web
    name: civicfix-frontend
    runtime: static
    buildCommand: cd civicfix-frontend && npm install && npm run build
    staticPublishPath: ./civicfix-frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
